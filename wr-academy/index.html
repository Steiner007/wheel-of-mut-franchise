<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WR Academy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lincoln's WR Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single portrait column (max 520px), stadium-night panels, fixed bottom nav, full-screen drill flows */
:root{
  --bg:#080e1c; --bg2:#0e1729; --panel:#142039; --panel2:#1a2947; --line:#253658;
  --fg:#eef3ff; --mute:#8e9cbb; --dim:#5d6c8c;
  --blue:#2f8cff; --blue2:#6db8ff; --green:#3dff9a; --red:#ff5470;
  --gold:#ffc847; --silver:#c9d3e3; --bronze:#d48a52; --purple:#a77bff;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  background-image:radial-gradient(120% 60% at 50% -10%,#14305e 0%,transparent 60%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
input,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
.disp{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px}
h2.sec{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 0}
.ico{display:inline-block;vertical-align:middle;width:22px;height:22px;flex:none}
.ico svg{width:100%;height:100%;display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.03em;line-height:.95}
.brand span{color:var(--blue2)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px;border:1px solid #2c4a80;
  background:linear-gradient(135deg,#17305a 0%,#0f1e3a 55%,#0b1529 100%);cursor:pointer;text-align:left;width:100%;display:block}
.hero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,140,255,.35),transparent 70%);pointer-events:none}
.hero .yard{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.035) 38px 40px);pointer-events:none}
.ovrbox{width:92px;flex:none;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);padding:10px 6px;text-align:center}
.ovrbox .v{font-family:var(--display);font-weight:800;font-size:46px;line-height:.9}
.ovrbox .v.unr{font-size:20px;line-height:1.1;padding:8px 0;color:var(--mute)}
.ovrbox .l{font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--mute)}
.pname{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;letter-spacing:.02em}
.pmeta{font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.bar{height:10px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--blue),var(--green));transition:width 1.1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(61,255,154,.5)}
.tierchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.07)}
.tierchip i{width:8px;height:8px;border-radius:50%;background:var(--tc,#9aa6bd)}

/* combine tracker */
.pips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pip{height:46px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.04em}
.pip.done{background:rgba(61,255,154,.12);border-color:rgba(61,255,154,.5);color:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;padding:0 18px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;transition:transform .12s ease,filter .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#4aa0ff,#1f6fe0);box-shadow:0 6px 22px rgba(47,140,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.go{background:linear-gradient(180deg,#5bffad,#1fd479);color:#032313;box-shadow:0 6px 22px rgba(61,255,154,.3)}
.btn.ghost{background:var(--panel);border:1px solid var(--line);font-size:17px}
.btn.danger{background:rgba(255,84,112,.12);border:1px solid rgba(255,84,112,.5);color:#ff8ea2;font-size:17px}
.btn.sm{min-height:44px;font-size:16px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;transition:transform .12s}
.qa button:active{transform:scale(.97)}
.qa .t{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.qa .ico{color:var(--blue2);width:26px;height:26px}

/* drill list */
.drill{width:100%;display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;transition:transform .12s}
.drill:active{transform:scale(.98)}
.drill .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(47,140,255,.14);color:var(--blue2);flex:none}
.drill .badge.ok{background:rgba(61,255,154,.14);color:var(--green)}
.drill .nm{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1}
.drill .sub{font-size:13px;color:var(--mute);margin-top:3px}
.drill .rt{margin-left:auto;text-align:right;flex:none}
.drill .rt .num{font-size:22px;font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--mute)}
.tag.g{background:rgba(61,255,154,.12);color:var(--green)}
.tag.gold{background:rgba(255,200,71,.14);color:var(--gold)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(8,14,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.nav .hl{position:absolute;top:6px;height:52px;width:20%;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.nav .hl::before{content:"";position:absolute;inset:0 10%;border-radius:14px;background:rgba(47,140,255,.16);box-shadow:inset 0 -2px 0 var(--blue2)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.nav button.on{color:var(--fg)}
.nav button.on .ico{color:var(--blue2)}

/* full screens */
.screen{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;background-image:radial-gradient(100% 50% at 50% 0%,#132a52 0%,transparent 70%)}
.screen .wrap{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sbar{display:flex;align-items:center;gap:10px}
.sbar .ttl{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.bigttl{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;text-transform:uppercase}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:#cfd8ec}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip.on{background:rgba(47,140,255,.2);border-color:var(--blue);color:#fff}

/* demo */
.demo{background:#0c2a1b;border-radius:16px;border:1px solid #1d5a3b;overflow:hidden}
.demo svg{display:block;width:100%;height:auto;max-height:280px}
.demo .ctl{display:flex;gap:8px;padding:8px;background:rgba(0,0,0,.35);flex-wrap:wrap}

/* runner */
.counter{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter .c{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.counter .c .num{font-size:42px;font-weight:800;line-height:1}
.counter .c .l{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--mute)}
.track{display:flex;flex-wrap:wrap;gap:5px}
.track i{width:14px;height:14px;border-radius:4px;background:var(--bg2);border:1px solid var(--line)}
.track i.y{background:var(--green);border-color:var(--green)}
.track i.n{background:var(--red);border-color:var(--red);opacity:.7}
.track i.cur{border-color:var(--blue2);box-shadow:0 0 0 2px rgba(109,184,255,.35)}
.bigpair{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:220px}
.bigbtn{border-radius:24px;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .1s}
.bigbtn:active{transform:scale(.96)}
.bigbtn .ico{width:44px;height:44px}
.bigbtn.yes{background:linear-gradient(180deg,#1bd776,#0e9c55);color:#02180c;box-shadow:0 10px 30px rgba(61,255,154,.25)}
.bigbtn.no{background:linear-gradient(180deg,#3a2333,#2a1724);color:#ff9fb0;border:2px solid rgba(255,84,112,.45)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.flash.g{background:radial-gradient(circle,rgba(61,255,154,.35),transparent 70%);animation:fl .45s ease}
.flash.r{background:radial-gradient(circle,rgba(255,84,112,.25),transparent 70%);animation:fl .45s ease}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:72px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.seg button.y.on{border-color:var(--green);background:rgba(61,255,154,.14);color:var(--green)}
.seg button.n.on{border-color:var(--red);background:rgba(255,84,112,.12);color:#ff8ea2}
.seglabel{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:center}
.stepper button{height:72px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:36px;font-weight:800}
.stepper .num{text-align:center;font-size:64px;font-weight:800}
.sw{display:grid;place-items:center;gap:10px;padding:10px 0}
.swbtn{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em;
  background:radial-gradient(circle at 50% 35%,#2a5ca8,#123063);border:3px solid var(--blue);box-shadow:0 0 40px rgba(47,140,255,.3)}
.swbtn.run{background:radial-gradient(circle at 50% 35%,#a6203d,#5c0f20);border-color:var(--red);box-shadow:0 0 40px rgba(255,84,112,.35)}
.swtime{font-family:var(--display);font-weight:800;font-size:64px;font-variant-numeric:tabular-nums;line-height:1}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.slot .num{font-size:28px;font-weight:800}
.slot.best{border-color:var(--gold);background:rgba(255,200,71,.08)}
.rest{background:rgba(255,200,71,.08);border:1px solid rgba(255,200,71,.4);border-radius:16px;padding:14px;display:flex;align-items:center;gap:14px}
.rest .num{font-size:44px;font-weight:800;color:var(--gold);min-width:70px;text-align:center}

/* hold to confirm */
.hold{position:relative;overflow:hidden;min-height:68px;border-radius:18px;background:var(--panel2);border:2px solid var(--green);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;user-select:none;-webkit-user-select:none;touch-action:none}
.hold i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,rgba(61,255,154,.25),rgba(61,255,154,.55))}
.hold span{position:relative}
.hold.holding i{width:100%;transition:width .9s linear}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl tr.cur td{color:var(--green);font-weight:700}
.tbl tr.done td{color:var(--mute)}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}

/* ratings */
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.rrow .nm{font-size:14px;font-weight:600;color:#d6deef}
.rrow .num{font-size:22px;font-weight:800}
.rrow .bar{grid-column:1/-1;height:7px}

/* awards */
.trophies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tro{background:radial-gradient(120% 80% at 50% 0%,#1d2c4c,#101a30);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tro .cup{width:48px;height:48px;color:#2c3a58}
.tro.on{border-color:rgba(255,200,71,.45);box-shadow:0 0 22px rgba(255,200,71,.12) inset}
.tro.on .cup{color:var(--gold);filter:drop-shadow(0 0 8px rgba(255,200,71,.55))}
.tro .n{font-family:var(--display);font-weight:700;font-size:15px;text-transform:uppercase;line-height:1.05}
.tro .d{font-size:11.5px;color:var(--mute);line-height:1.3}
.tro.off .n{color:var(--dim)}

/* overlays */
.ov{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:#02050c;overflow-y:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.beam{position:fixed;top:-10%;width:60%;height:120%;pointer-events:none;opacity:0;z-index:0;
  background:linear-gradient(180deg,rgba(220,235,255,.5),rgba(160,200,255,.05) 70%,transparent);filter:blur(6px);animation:beam .9s ease forwards}
.beam.l{left:-12%;transform:rotate(18deg);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation-delay:.5s}
.beam.r{right:-12%;transform:rotate(-18deg);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation-delay:.85s}
@keyframes beam{to{opacity:1}}
.ov>*:not(canvas):not(.beam){position:relative;z-index:3}
.reveal-title{font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:.06em;color:#fff;text-shadow:0 0 30px rgba(47,140,255,.8);opacity:0;animation:pop .6s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(60px) scale(.92)}100%{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1;transform:none}}
.lv-num{font-family:var(--display);font-weight:800;font-size:150px;line-height:.85;background:linear-gradient(180deg,#fff,#6db8ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s ease both}
.sweep{position:fixed;inset:0;pointer-events:none;z-index:1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 1.3s .3s ease forwards}
@keyframes sweep{to{transform:translateX(100%)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--panel2);border:1px solid var(--green);border-radius:14px;padding:10px 16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 2.6s ease forwards;max-width:calc(100% - 32px);text-align:center}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}

/* player card */
.pcard-wrap{perspective:900px;width:100%;max-width:330px}
.pcard{--tc:#9aa6bd;--tc2:#4b566d;position:relative;border-radius:22px;padding:18px 16px 16px;overflow:hidden;transform-style:preserve-3d;transition:transform .15s ease-out;
  background:linear-gradient(160deg,var(--tc2) 0%,#0d1628 45%,#0a1222 100%);border:2px solid var(--tc);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.6),0 0 50px color-mix(in srgb,var(--tc) 35%,transparent);text-align:left}
.pcard::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.12) 48%,transparent 60%);pointer-events:none}
.pcard::before{animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.pcard .glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,15%),rgba(255,255,255,.22),transparent 45%);mix-blend-mode:overlay;z-index:1}
.pcard .holo{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:color-dodge;z-index:1;
  background:repeating-linear-gradient(115deg,rgba(255,80,160,.0) 0%,rgba(255,80,160,.18) 8%,rgba(80,200,255,.18) 16%,rgba(120,255,160,.18) 24%,rgba(255,230,90,.18) 32%,rgba(255,80,160,0) 40%);
  background-size:300% 300%;background-position:var(--hx,50%) var(--hy,50%)}
.pcard.foil .holo{opacity:.9}
.pcard.legend .holo{opacity:.35}
.pcard>*:not(.glare):not(.holo){position:relative;z-index:2}
.pcard.legend{animation:legend 3s linear infinite}
@keyframes legend{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.pcard .ovr{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;color:var(--tc)}
.pcard .ovr.unr{font-size:26px;line-height:1.1;color:var(--mute)}
.pcard .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.pcard .st{display:flex;flex-direction:column;gap:3px}

/* ================= CLOUD SAVE =================
   Every change is also written to a private spot in the signed-in Claude account (db capability,
   path data/users/<id>/…, readable only by that person). Survives cleared browser data and new
   devices. Large saves are split into chunks. Daily backups and safety copies before resets,
   restores and removals mean nothing is ever overwritten without a copy to go back to. */
const CLOUD={db:null,uid:null,ready:false,status:'starting',last:null,lastJson:null,timer:null,chain:Promise.resolve(),meta:null};
const CHUNK=180000;
let LOCAL_FRESH=false;
const cdoc = k => CLOUD.db.doc(`data/users/${CLOUD.uid}/${k}`);
function chunkify(str){ const a=[]; for(let i=0;i<str.length;i+=CHUNK) a.push(str.slice(i,i+CHUNK)); return a.length?a:['']; }
async function cloudWriteSet(prefix,json){ const parts=chunkify(json); for(let i=0;i<parts.length;i++) await cdoc(`${prefix}_${i}`).set({c:parts[i],i,n:parts.length}); return parts.length; }
async function cloudReadSet(prefix,n){ let out=''; for(let i=0;i<n;i++){ const d=await cdoc(`${prefix}_${i}`).get(); if(!d.exists) return null; out+=d.data().c; } return out; }
function rootSummary(r){ return Object.values(r.profiles||{}).map(p=>`${p.player?.name||'Player'} ${(p.results||[]).length} tests`).join(' · '); }
function setCloud(st){ CLOUD.status=st; const el=document.getElementById('cloudline'); if(el) el.innerHTML=cloudLine(); }
function cloudLine(){ const t=CLOUD.last?new Date(CLOUD.last).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';
  return ({ok:`<span class="cdot ok"></span>Saved to your Claude account${t?' · '+t:''}`, saving:'<span class="cdot busy"></span>Saving to your Claude account…',
    starting:'<span class="cdot busy"></span>Connecting to your Claude account…', error:'<span class="cdot err"></span>Couldn\'t reach your Claude account. Saved on this phone; will retry.',
    local:'<span class="cdot err"></span>Account save not available here (signed out or offline copy). Saved on this phone only.'})[CLOUD.status]||''; }
function scheduleCloud(ms=1200){ if(!CLOUD.ready) return; clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(()=>{ CLOUD.chain=CLOUD.chain.then(cloudPush).catch(()=>{}); },ms); }
async function cloudSnapshotJSON(json,label){ // a named safety copy, kept alongside daily backups
  if(!CLOUD.ready) return; const key='snap-'+Date.now();
  const n=await cloudWriteSet(key,json); let sum=''; try{ sum=rootSummary(JSON.parse(json)); }catch(e){}
  CLOUD.meta.snaps.push({key,n,savedAt:Date.now(),label,summary:sum}); await pruneSnaps(); await cdoc('meta').set(CLOUD.meta); }
function queueSnapshot(label){ const json=JSON.stringify(ROOT); try{ localStorage.setItem('wr-academy-prev',json); localStorage.setItem('wr-academy-prev-label',label); }catch(e){}
  CLOUD.chain=CLOUD.chain.then(()=>cloudSnapshotJSON(json,label)).catch(()=>{}); }
async function pruneSnaps(){ // keep the 10 newest daily backups and the 10 newest safety copies
  const daily=CLOUD.meta.snaps.filter(x=>x.label==='Daily backup').sort((a,b)=>b.savedAt-a.savedAt), other=CLOUD.meta.snaps.filter(x=>x.label!=='Daily backup').sort((a,b)=>b.savedAt-a.savedAt);
  const drop=[...daily.slice(10),...other.slice(10)];
  for(const x of drop){ for(let i=0;i<x.n;i++){ try{ await cdoc(`${x.key}_${i}`).delete(); }catch(e){} } }
  CLOUD.meta.snaps=CLOUD.meta.snaps.filter(x=>!drop.includes(x)); }
async function cloudPush(){
  const json=JSON.stringify(ROOT); if(json===CLOUD.lastJson) return; setCloud('saving');
  try{
    const n=await cloudWriteSet('main',json);
    const dk='day-'+todayKey();
    if(!CLOUD.meta.snaps.some(x=>x.day===dk)){ const key='snap-'+dk; const sn=await cloudWriteSet(key,json);
      CLOUD.meta.snaps=CLOUD.meta.snaps.filter(x=>x.key!==key); CLOUD.meta.snaps.push({key,day:dk,n:sn,savedAt:Date.now(),label:'Daily backup',summary:rootSummary(ROOT)}); await pruneSnaps(); }
    CLOUD.meta.main={n,savedAt:ROOT.savedAt||Date.now()}; await cdoc('meta').set(CLOUD.meta);
    CLOUD.lastJson=json; CLOUD.last=Date.now(); setCloud('ok');
  }catch(e){ setCloud('error'); if(e&&e.code==='quota_exceeded') toast('Account storage is full. Your stats are still saved on this phone.'); else { clearTimeout(CLOUD.timer); CLOUD.timer=setTimeout(()=>scheduleCloud(0),8000+Math.random()*4000); } }
}
function hasData(r){ return Object.values(r?.profiles||{}).some(p=>(p.results||[]).length||(p.practice||[]).length||(p.catchLog||[]).length||p.xp); }
function loadRoot(o){ ROOT={v:2,active:o.active,profiles:{},lylaAdded:true,savedAt:o.savedAt}; for(const [k,x] of Object.entries(o.profiles)) ROOT.profiles[k]=norm(x);
  if(!ROOT.profiles[ROOT.active]) ROOT.active=Object.keys(ROOT.profiles)[0]; S=ROOT.profiles[ROOT.active]; S.inProgress=S.inProgress||null; queue=[]; BOARD_CACHE.key=null; }
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return setCloud('local');
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id) return setCloud('local');
    CLOUD.db=db; CLOUD.uid=id;
    const m=await cdoc('meta').get(); CLOUD.meta=m.exists?{snaps:[],...m.data()}:{snaps:[]};
    let cloudRoot=null;
    if(CLOUD.meta.main){ const txt=await cloudReadSet('main',CLOUD.meta.main.n); if(txt){ try{ cloudRoot=JSON.parse(txt); }catch(e){} } }
    CLOUD.ready=true;
    if(cloudRoot && cloudRoot.v===2 && cloudRoot.profiles){
      const localNewer = !LOCAL_FRESH && (ROOT.savedAt||0) > (cloudRoot.savedAt||0);
      if(localNewer){ await cloudSnapshotJSON(JSON.stringify(cloudRoot),'Older copy from your account'); }
      else {
        if(hasData(ROOT) && JSON.stringify(ROOT.profiles)!==JSON.stringify(cloudRoot.profiles)) await cloudSnapshotJSON(JSON.stringify(ROOT),'Copy from this device');
        const st=UI.screen; loadRoot(cloudRoot); UI.screen=(st&&st.type!=='run'&&st.type!=='confirm'&&st.type!=='pconfirm')?st:null;
        DB.put(ROOT); CLOUD.lastJson=JSON.stringify(ROOT); CLOUD.last=Date.now(); render();
        if(hasData(cloudRoot)) toast('Stats loaded from your Claude account'); }
    }
    setCloud('ok'); scheduleCloud(0);
  }catch(e){ setCloud('error'); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && CLOUD.ready){ clearTimeout(CLOUD.timer); CLOUD.chain=CLOUD.chain.then(cloudPush).catch(()=>{}); } });
async function restoreSnap(key){
  const x=CLOUD.meta?.snaps.find(s=>s.key===key); if(!x) return false;
  const txt=await cloudReadSet(key,x.n); if(!txt) return false;
  queueSnapshot('Before restoring a backup'); await CLOUD.chain;
  return restoreFrom(txt); }

function interp(bench,x,lowerBetter){

function evaluateSeason(){

  if(isRated() && !s.startRatings){ const fc=s.num===1?firstCompleteSession():null; s.startRatings=fc?ratingsFrom(sessionResults(fc.id)):currentRatings(); s.startOvr=ovrOf(s.startRatings); }
  const won = m => m && !m.wonAt && S.results.some(r=>r.drillId===m.drill&&r.date>m.startedAt&&meets(m.drill,r.raw,m.target));
  for(let guard=0;guard<8;guard++){
    if(s.stage===2 && won(s.matchup)){ s.matchup.wonAt=nowISO();

    if(s.stage===4){ const cur=s.rounds[s.rounds.length-1];

        else { completeCh(`s${s.num}_r${s.rounds.length}`,`${cur.name} win vs ${opp}`,s.rounds.length===1?75:100,{icon:'shield',detail:matchText(cur)});

}

function seriesFor(key){

function lineChart(sr){
  const W=340,H=190,L=40,R=12,T=14,B=28, pts=sr.pts;
  if(!pts.length) return `<div class="mute" style="padding:30px 0;text-align:center">No results yet for this chart.</div>`;
  const t0=pts[0].t, t1=pts[pts.length-1].t, span=Math.max(1,t1-t0);
  const X=i=> pts.length===1? L+(W-L-R)/2 : L+(W-L-R)*((pts[i].t-t0)/span*0.85+ i/(pts.length-1)*0.15);
  const Y=v=>{ const k=(v-sr.min)/(sr.max-sr.min); return T+(H-T-B)*(sr.lower? k : 1-k); };
  const ticks=[0,1,2,3,4].map(i=>sr.min+(sr.max-sr.min)*i/4);
  const tickFmt=v=> sr.lower? v.toFixed(1) : Math.round(v);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area=pts.length>1?`${line} L${X(pts.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B}Z`:'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Progress chart">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff" stop-opacity=".35"/><stop offset="1" stop-color="#2f8cff" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#253658" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#8e9cbb" font-family="Barlow,sans-serif">${tickFmt(v)}</text>`).join('')}
    ${area?`<path d="${area}" fill="url(#ga)"/>`:''}
    <path d="${line}" fill="none" stroke="#6db8ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?5.5:p.pr?4.5:3.5}" fill="${p.pr?'#ffc847':i===pts.length-1?'#3dff9a':'#6db8ff'}" stroke="#080e1c" stroke-width="1.5"><title>${p.label}: ${sr.fmt(p.y)}</title></circle>`).join('')}
    <text x="${L}" y="${H-8}" font-size="10" fill="#8e9cbb" font-family="Barlow,sans-serif">${pts[0].label}</text>
    ${pts.length>1?`<text x="${W-R}" y="${H-8}" text-anchor="end" font-size="10" fill="#8e9cbb" font-family="Barlow,sans-serif">${pts[pts.length-1].label}</text>`:''}
  </svg></div>`;
}
function chartSummary(key,sr){
  const p=sr.pts; if(p.length<2) return p.length?`<div class="note">One result so far. Run it again to start a trend line.</div>`:'';
  const a=p[0].y, z=p[p.length-1].y, bestV=sr.lower?Math.min(...p.map(x=>x.y)):Math.max(...p.map(x=>x.y));
  const diff=sr.lower? a-z : z-a, noise = key==='overall'? Math.abs(diff)<=2 : sr.lower? Math.abs(diff)<.15 : Math.abs(diff)<=1;
  const name = key==='overall'?'Overall rating':DM[key].name;
  const msg = noise? `${name} is about the same as the first result (${sr.fmt(a)} → ${sr.fmt(z)}). That's within normal day-to-day variation.`

}

/* ---------- Drill demo SVG ---------- */
function demoSVG(d,route){
  // field: 8px per yard, LOS at y=200, QB at (100,216)
  let path='', ball='', extra='';
  const QB='100,214';
  const cones = pts => pts.map(([x,y])=>`<path d="M${x-5} ${y+4} L${x} ${y-6} L${x+5} ${y+4}Z" fill="#ff8a2b"/>`).join('');
  const r = route || 'Slant';
  if(d.id==='sure_hands'){ extra=cones([[100,174]]); path='M100 176 L100 176'; ball=`M100 214 Q100 192 100 178`; }
  else if(d.id==='route_master'||d.id==='quick_cuts'){
    if(r==='Slant'){ path='M60 200 L60 176 L110 136'; ball='M100 214 Q104 170 110 138'; extra=cones([[60,176]]); }
    if(r==='Out'){ path='M60 200 L60 164 L16 164'; ball='M100 214 Q60 170 18 164'; extra=cones([[60,164]]); }
    if(r==='Curl'){ path='M60 200 L60 144 L68 158'; ball='M100 214 Q84 176 68 158'; extra=cones([[60,144]]); }
  }
  else if(d.id==='dash'){ path='M100 200 L100 40'; extra=cones([[86,200],[114,200],[86,40],[114,40]]); }
  else if(d.id==='dash10'){ path='M100 200 L100 120'; extra=cones([[86,200],[114,200],[86,120],[114,120]]); }
  else if(d.id==='shuttle'){ path='M100 150 L140 150 L60 150 L100 150'; extra=cones([[60,154],[100,154],[140,154]]); }
  else if(d.id==='deep_threat'){ path='M60 200 L60 104'; ball='M100 214 Q90 120 60 106'; extra=cones([[60,104]]); }
  else if(d.id==='playmaker'){ path='M60 200 L60 186 L84 164 L52 140 L84 116 L52 92 L84 68'; ball='M100 214 Q82 194 60 188'; extra=cones([[86,164],[50,140],[86,116],[50,92],[86,68]]); }
  const dur = (d.id==='playmaker'?3.4: d.id==='dash'?2: d.id==='dash10'?1.2: d.id==='shuttle'?3:2.2) * (UI.demoSlow?2.5:1);
  const ballBegin = d.id==='sure_hands'?'0.2': d.id==='playmaker'?'0':(dur*0.55).toFixed(2);
  const yl=[]; for(let y=200;y>=24;y-=40) yl.push(`<line x1="0" y1="${y}" x2="200" y2="${y}" stroke="rgba(255,255,255,${y===200?.55:.18})" stroke-width="${y===200?2:1}"/>`);
  return `<svg id="demo" viewBox="0 0 200 232" role="img" aria-label="${esc(d.name)} demonstration">
    <rect width="200" height="232" fill="#0f3a24"/>${yl.join('')}
    <text x="196" y="196" fill="rgba(255,255,255,.4)" font-size="8" text-anchor="end" font-family="sans-serif">LOS</text>
    ${d.id==='dash'?'<text x="196" y="36" fill="rgba(255,255,255,.5)" font-size="8" text-anchor="end" font-family="sans-serif">20 YD</text>':''}
    ${d.id==='dash10'?'<text x="196" y="116" fill="rgba(255,255,255,.5)" font-size="8" text-anchor="end" font-family="sans-serif">10 YD</text>':''}
    ${d.id==='shuttle'?'<text x="100" y="172" fill="rgba(255,255,255,.6)" font-size="8" text-anchor="middle" font-family="sans-serif">5 YD · 5 YD</text>':''}
    ${extra}
    <path d="${path}" fill="none" stroke="rgba(109,184,255,.55)" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="100" cy="214" r="7" fill="#eef3ff"/><text x="100" y="217" font-size="7" text-anchor="middle" font-weight="700" fill="#0a1222" font-family="sans-serif">QB</text>
    <g><circle r="7" fill="#3dff9a"/><text y="3" font-size="7" text-anchor="middle" font-weight="700" fill="#02180c" font-family="sans-serif">WR</text>
      <animateMotion id="wrm" dur="${dur}s" begin="indefinite" fill="freeze" path="${path}" calcMode="linear"/></g>
    ${ball?`<ellipse rx="4.5" ry="3" fill="#a0592a" stroke="#fff" stroke-width=".8" opacity="0"><set attributeName="opacity" to="1" begin="wrm.begin+${ballBegin}s"/>
      <animateMotion dur="${(d.id==='sure_hands'?0.7*(UI.demoSlow?2.5:1):dur*0.45).toFixed(2)}s" begin="wrm.begin+${ballBegin}s" fill="freeze" path="${ball}" rotate="auto"/></ellipse>`:''}
  </svg>`;
}

function runCounts(p){
  const d=drillOf(p);
  if(d.type==='binary') return {n:p.attempts.length, score:p.attempts.filter(Boolean).length};
  if(d.type==='route') return {n:p.attempts.length, score:p.attempts.reduce((a,x)=>a+(x.ok?1:0)+(x.caught?1:0),0)};
  return {n:p.attempts.length, score:p.attempts.length?Math.min(...p.attempts):null};
}

      ${done?`<div class="panel" style="text-align:center;border-color:var(--green)"><div class="disp" style="font-size:30px;font-weight:800;color:var(--green)">All 15 routes done</div><div class="mute" style="margin-top:4px">${c.score} of 30 points</div></div>
        <button class="btn go" data-a="toConfirm">Review Result</button>`
      :`<div class="panel" style="text-align:center;padding:12px"><div class="disp" style="font-size:40px;font-weight:800;color:var(--blue2)">${rname}</div><div class="mute">${rname} ${repInRoute} of 5</div></div>
        <div><div class="seglabel">Route</div><div class="seg"><button class="y ${dr.ok===true?'on':''}" data-a="rd" data-k="ok" data-v="1">Correct</button><button class="n ${dr.ok===false?'on':''}" data-a="rd" data-k="ok" data-v="0">Off</button></div></div>
        <div><div class="seglabel">Catch</div><div class="seg"><button class="y ${dr.caught===true?'on':''}" data-a="rd" data-k="caught" data-v="1">Clean</button><button class="n ${dr.caught===false?'on':''}" data-a="rd" data-k="caught" data-v="0">Drop</button></div></div>
        <button class="btn go" data-a="logRoute" ${dr.ok==null||dr.caught==null?'disabled':''}>Log Rep · +${(dr.ok?1:0)+(dr.caught?1:0)}</button>`}

  } else { // timed

    const done = p.attempts.length>=3;
    body = `<div class="slots">${[0,1,2].map(i=>`<div class="slot ${i===bestIdx?'best':''}"><div class="seglabel" style="margin:0">Run ${i+1}</div><div class="num">${p.attempts[i]!=null?p.attempts[i].toFixed(2):'—'}</div>${i===bestIdx?'<span class="tag gold">Best</span>':''}</div>`).join('')}</div>

      ${done?`<div class="panel" style="text-align:center;border-color:var(--green)"><div class="disp" style="font-size:30px;font-weight:800;color:var(--green)">Best: ${Math.min(...p.attempts).toFixed(2)} s</div></div><button class="btn go" data-a="toConfirm">Review Result</button>`
      :`<div class="sw"><div class="swtime" id="swt">${(UI.sw.value!=null?UI.sw.value:0).toFixed(2)}</div>
        <button class="swbtn ${UI.sw.running?'run':''}" data-a="sw">${UI.sw.running?'STOP':'START'}</button>
        <div class="note" style="text-align:center">${d.swNote||'Tap START on “Go”, STOP at the finish.'}</div></div>
        <div class="row"><input id="tman" inputmode="decimal" placeholder="Or type time, e.g. 4.95" value="${UI.sw.value!=null&&!UI.sw.running?UI.sw.value.toFixed(2):''}" aria-label="Time in seconds">
        <button class="btn primary sm" style="flex:none;padding:0 18px" data-a="logTime">Log</button></div>`}
      <div class="row">${p.attempts.length?`<button class="btn ghost sm" style="flex:1" data-a="undo">${I.undo} Undo</button>`:''}
      ${p.attempts.length&&!done?`<button class="btn ghost sm" style="flex:1" data-a="toConfirm">Finish with ${p.attempts.length}</button>`:''}</div>`;
  }
  return `<div class="screen"><div class="wrap">${head}${body}</div></div>`;
}
function rawOf(p){ const d=drillOf(p);
  if(d.type!=='timed' && p.mode==='total') return p.total;
  const c=runCounts(p); return c.score; }
function screenConfirm(){
  const p=S.inProgress, d=DM[p.drillId], raw=rawOf(p), prev=best(d.id);

  return `<div class="screen"><div class="wrap">
    <div class="sbar"><button class="iconbtn" data-a="backToRun" aria-label="Back to drill">${I.back}</button><span class="ttl">Parent check</span></div>

      ${isPR?`<div style="margin-top:10px"><span class="tag gold">New personal record · was ${fmtRaw(d.id,prev.raw)}</span></div>`:''}
    </div>
    <div class="panel stack" style="font-size:15px">
      <div class="row between"><span class="mute">Player</span><b style="color:var(--blue2)">${esc(S.player.name)}</b></div>

      <div class="row between"><span class="mute">Setup</span><b>${Object.entries(settingsFor(d)).map(([k,v])=>`${esc(v)} ${k.includes('Yd')?'yd':k}`).join(', ')||'Standard'}</b></div>

}
function settingsFor(d){ const s={...d.settings}; if(d.id==='deep_threat') s.distanceYd=S._deepYd||d.settings.distanceYd; return s; }

/* ---------- Player card ---------- */

    <div class="row between" style="align-items:flex-start">
      <div><div class="ovr num ${ovrVal==null?'unr':''}" ${ovrVal!=null?`data-count="${ovrVal}"`:''}>${ovrVal==null?'UNRATED':(opts.count?0:ovrVal)}</div><div class="eyebrow" style="color:var(--mute);margin-top:4px">Overall</div></div>
      <div style="text-align:right"><div class="tierchip" style="--tc:${t.c}"><i></i>${t.name}</div><div class="pmeta" style="margin-top:6px">${esc(S.player.position)} · Age ${esc(S.player.age)}</div></div>
    </div>
    <div class="pname" style="margin-top:12px;font-size:44px">${esc(S.player.name.toUpperCase())}</div>
    <div class="disp" style="font-size:15px;color:var(--mute);font-weight:700;margin-top:2px">Lv ${L[0]} · ${L[1]}</div>
    <div class="stats">${SKILLS.map((s,i)=>{ const v=ratingsMap[s.key];
      return `<div class="st ${opts.stagger?'anim-in':''}" style="${opts.stagger?`animation-delay:${opts.stagger+i*.35}s`:''}"><span class="k">${s.key==='speed'?`SPEED · SPD${(()=>{ const n=['dash','dash10','shuttle'].filter(id=>latest(id)).length; return n&&n<3?` (${n}/3)`:''; })()}`:s.name.toUpperCase()}</span><span class="v num">${v==null?'—':v}</span><div class="bar"><i data-w="${v||0}" data-delay="${opts.stagger?(opts.stagger+i*.35):0}"></i></div></div>`; }).join('')}</div>
    ${(()=>{ const r=strRating(strBests()); return r==null?'':`<div class="st" style="margin-top:12px"><span class="k">STRENGTH · STR <span style="color:var(--mute);font-weight:600">(bonus stat, not in OVR)</span></span><span class="v num" style="color:var(--gold)">${r}</span><div class="bar"><i data-w="${r}" style="background:linear-gradient(90deg,#e0a526,#ffc847)"></i></div></div>`; })()}

    <div class="note" style="margin-top:10px;font-size:11px">Madden-style 50–99 vs the academy league · card color reflects career level, not ability</div>
  </div></div>`;
}

  const idx=tabs.findIndex(t=>t[0]===UI.tab);

  if(UI.screen?.type==='drill') screen=screenDrill(DM[UI.screen.id]);
  else if(UI.screen?.type==='run' && S.inProgress) screen=screenRun();
  else if(UI.screen?.type==='confirm' && S.inProgress) screen=screenConfirm();

  else if(UI.screen?.type==='ch') screen=screenCh(UI.screen);
  else if(UI.screen?.type==='skilltest') screen=screenSkillTest();

  app.innerHTML = `<main class="app">${views[UI.tab]()}</main>
    <nav class="nav" aria-label="Main"><div class="in"><div class="hl" style="transform:translateX(${idx*100}%)"></div>

    ${screen}${ov}${modalHTML()}${toasts.map(t=>`<div class="toast">${t}</div>`).join('')}`;
  window.scrollTo(0,scrollY); const ns=document.querySelector('.screen'); if(ns && UI._keepScroll) ns.scrollTop=sTop; UI._keepScroll=false;
  postRender();
}
function postRender(){
  requestAnimationFrame(()=>{ document.querySelectorAll('[data-w]').forEach(el=>{ const dl=parseFloat(el.dataset.delay||0);
    if(reduced()) el.style.width=el.dataset.w+'%'; else setTimeout(()=>el.style.width=el.dataset.w+'%', dl*1000+60); }); });
  const demo=document.getElementById('demo');
  if(demo && !reduced()) setTimeout(()=>{ try{ demo.getElementById('wrm')?.beginElement() }catch(e){} },350);
  const ov=document.getElementById('ov');
  if(ov && !ov.dataset.ran){ ov.dataset.ran=1; const o=queue[0];
    const c=ov.querySelector('[data-count]');
    if(c){ const target=+c.dataset.count, delay=o.type==='reveal'?(1.6+6*.35+.2)*1000:400;
      if(reduced()) c.textContent=target; else setTimeout(()=>countUp(c,target,900),delay); }
    if(o.type==='reveal'){ setTimeout(()=>{confetti();sfx.big()}, reduced()?0:(1.6+6*.35+1.2)*1000); }
    if(o.type==='levelup'){ setTimeout(()=>{confetti();sfx.big()},300); }
    if(o.type==='awards'){ setTimeout(()=>{confetti(140,['#ffc847','#ffe08a','#fff3c4','#e0a526']);sfx.done()},400); }
    if(o.type==='award'){ setTimeout(()=>{confetti(110,['#ffc847','#ffe08a','#fff3c4','#e0a526']);sfx.done()},500); }
    if(o.type==='strplace'||o.type==='strwork'){ setTimeout(()=>{ confetti(o.type==='strwork'?150:90,['#ffc847','#ffe08a','#ffffff']); sfx.done(); },400); }
    if(o.type==='place'){ setTimeout(()=>{ if(o.place<=10) confetti(120); sfx.done(); },500); }
    if(o.type==='rank'){ const ms=[50,25,10,5,3,1].some(t=>o.to<=t&&(o.from==null||o.from>t)); setTimeout(()=>{ if(ms) confetti(150); sfx.done(); },1300); }
    if(o.type==='stage'){ setTimeout(()=>sfx.big(),300); }
    if(o.type==='ceremony'){ setTimeout(()=>{confetti(200,['#ffc847','#ffe08a','#ffffff','#3dff9a']);sfx.big()},700); }
    if(o.type==='challenge' && o.champ){ setTimeout(()=>{confetti(220,['#ffc847','#ffe08a','#ffffff']);sfx.big()},1000); }
    else if(o.type==='challenge'){ setTimeout(()=>{confetti(o.boss?180:110,o.boss?['#ffc847','#ffe08a','#ffffff']:undefined); o.boss?sfx.big():sfx.done()},300); }
    const card=ov.querySelector('#pcard'); if(card) tilt(card);
  }
}
function countUp(el,target,ms){ const t0=performance.now(); const step=t=>{ const k=Math.min(1,(t-t0)/ms); el.textContent=Math.round(target*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
function tilt(card){ if(reduced()) return;
  card.parentElement.addEventListener('pointermove',e=>{ const r=card.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    card.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`;
    card.style.setProperty('--mx',((x+.5)*100)+'%'); card.style.setProperty('--my',((y+.5)*100)+'%');
    card.style.setProperty('--hx',((x+.5)*100)+'%'); card.style.setProperty('--hy',((y+.5)*100)+'%'); });
  card.parentElement.addEventListener('pointerleave',()=>{ card.style.transform=''; });
  // phones: gentle idle sway so the foil still moves without a mouse
  let t0=performance.now(); const sway=t=>{ if(!document.body.contains(card)) return; if(!card.matches(':hover')){ const k=(t-t0)/1000;
      const x=Math.sin(k*.9)*.25, y=Math.cos(k*.7)*.2; card.style.transform=`rotateY(${x*14}deg) rotateX(${-y*10}deg)`;
      card.style.setProperty('--mx',((x+.5)*100)+'%'); card.style.setProperty('--my',((y+.5)*100)+'%'); card.style.setProperty('--hx',((x+.5)*100)+'%'); card.style.setProperty('--hy',((y+.5)*100)+'%'); }
    requestAnimationFrame(sway); }; requestAnimationFrame(sway); }
function confetti(n=160,cols=['#3dff9a','#2f8cff','#ffc847','#ffffff','#a77bff']){
  if(reduced()) return; const cv=document.getElementById('conf'); if(!cv) return;
  const ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; ctx.scale(dpr,dpr);
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  const step=t=>{ if(!document.body.contains(cv)) return; ctx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){ p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); }
    if(t-t0<3500) requestAnimationFrame(step); else ctx.clearRect(0,0,innerWidth,innerHeight); };
  requestAnimationFrame(step);
}

function startCombine(){
  if(S.inProgress){ UI.screen={type:'run'}; render(); return; }
  if(isRated() && !activeSession()){ S.sessions.push({id:uid(),num:S.sessions.length+1,startedAt:new Date().toISOString()}); save(); }
  const act=activeSession(); const m=act?sessionResults(act.id):{};
  const next=DRILLS.find(d=>!m[d.id])||DRILLS[0];
  UI.demoRoute='Slant'; UI.screen={type:'drill',id:next.id}; render();
}
function saveResult(){
  const p=S.inProgress, d=DM[p.drillId], raw=rawOf(p), skBefore=currentRatings()[d.skill], ovrBefore=ovrOf(currentRatings());
  if(!isRated() && !activeSession()) S.sessions.push({id:uid(),num:S.sessions.length+1,startedAt:new Date().toISOString()});
  const act=activeSession();
  const prev=best(d.id);
  const res={id:uid(),drillId:d.id,date:new Date().toISOString(),raw,max:d.max||d.attempts,attempts:p.mode==='total'?null:p.attempts,entry:d.type==='timed'?'timed':p.mode,settings:settingsFor(d),
    sessionId:(act && !sessionResults(act.id)[d.id])?act.id:null,scoringModel:'v1'};
  if(prev && better(d.id,raw,prev.raw)){ res.pr=true; S.prCount=(S.prCount||0)+1; }
  S.results.push(res); S.inProgress=null; UI.sw={running:false,start:0,value:null}; UI.rest=0; clearInterval(UI.restTimer);
  // XP
  const before=queue.length;
  const prevLatest=resultsFor(d.id).filter(r=>r.id!==res.id).pop();
  queue.push({type:'place',drill:d.id,raw,place:placeFor(d.id,raw),prev:prevLatest?placeFor(d.id,prevLatest.raw):null,pr:!!res.pr,sk:d.skill,skBefore,skAfter:currentRatings()[d.skill],ovrBefore,ovrAfter:ovrOf(currentRatings())});
  const got = practiceXP(d.name);
  if(res.pr){ grantXP('pr_'+res.id,XP_RULES.personalRecord,'Personal record: '+d.name); S.chCount=(S.chCount||0)+1;
    queue.push({type:'challenge',name:'Beat Your '+d.name,xp:XP_RULES.personalRecord,pr:true,detail:`${fmtRaw(d.id,prev.raw)} → ${fmtRaw(d.id,raw)}`}); }
  // combine complete?
  let completed=false;
  if(act && Object.keys(sessionResults(act.id)).length===DRILLS.length){ act.completedAt=new Date().toISOString(); completed=true; }
  afterSave(before, completed?act.id:null);
  if(completed && S.daily && S.daily.date===todayKey() && !S.daily.slots.some(id=>S.chDone[dailyKey(id)])) S.daily=null; // re-aim today's missions at the new weakest skills
  save();
  sfx.done();
  const nextD = act&&!completed&&!p.oneSkill ? DRILLS.find(x=>!sessionResults(act.id)[x.id]) : null;
  UI.screen = nextD ? {type:'drill',id:nextD.id} : null;
  if(p.oneSkill && UI.chain && UI.chain[0]===d.id){ UI.chain.shift(); if(UI.chain.length){ goChain(); toast(`Saved · ${fmtRaw(d.id,raw)} · next up ${DM[UI.chain[0]].name}`); return; } UI.chain=null; }
  if(!nextD && !completed && !p.oneSkill) UI.tab='train';
  UI.demoRoute='Slant';
  toast(`Saved · ${fmtRaw(d.id,raw)} · ${ordinal(placeFor(d.id,raw))} of 100${got?` · +${XP_RULES.practice} XP`:''}${res.pr?' · New PR!':''}`);
}

  closeModal:(el,e)=>{ if(e && e.target.closest('[data-stop]') && !e.target.closest('[data-a="closeModal"]:not(.modalbg)')) return; UI.modal=null; render(); }
};
function confettiMini(){ /* small in-drill celebration */ if(reduced()) return; const c=document.createElement('canvas'); c.id='conf'; c.className='conf'; c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70'; document.body.appendChild(c); confetti(90); setTimeout(()=>c.remove(),3600); }
function tickSW(){ if(!UI.sw.running) return; const el=document.getElementById('swt'); if(el) el.textContent=((performance.now()-UI.sw.start)/1000).toFixed(2); requestAnimationFrame(tickSW); }
function startRest(){ UI.rest=60; clearInterval(UI.restTimer); render();
  UI.restTimer=setInterval(()=>{ UI.rest--; const el=document.getElementById('restn'); if(UI.rest<=0){ clearInterval(UI.restTimer); UI.rest=0; tone([880,880],.15); render(); } else if(el) el.textContent=UI.rest; },1000); }

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.classList.contains('modalbg') && e.target!==el) { const inner=e.target.closest('[data-a]'); if(inner===el) return; }
  const fn=A[el.dataset.a]; if(fn) fn(el,e);
});
function canDownload(){ try{ return window.self===window.top; }catch(e){ return false; } }
function restoreFrom(txt){ try{ const o=JSON.parse(txt);
    if(o && o.v===2 && o.profiles){ loadRoot(o); }
    else if(o && o.v===1 && Array.isArray(o.results)) S=norm(o); // older single-player backup goes into the current player
    else return false;
    S.inProgress=null; queue=[]; BOARD_CACHE.key=null; save(); return true; }catch(e){ return false; } }
document.addEventListener('change',e=>{
  if(e.target.id==='bkfile' && e.target.files[0]){ const f=e.target.files[0], rd=new FileReader();
    rd.onload=()=>{ queueSnapshot('Before restoring from a file'); if(restoreFrom(rd.result)){ render(); toast('Backup restored'); } else toast("That file isn't a WR Academy backup."); }; rd.readAsText(f); return; } if(e.target.dataset.ch==='name'){ const v=e.target.value.trim().slice(0,16); if(v){ S.player.name=v; save(); render(); } } });
// hold-to-confirm
function holdStart(e){ const el=e.target.closest('[data-hold]'); if(!el) return; e.preventDefault(); el.classList.add('holding');
  UI.holdT=setTimeout(()=>{ el.classList.remove('holding'); A_hold[el.dataset.hold](); },900); }
function holdEnd(){ clearTimeout(UI.holdT); document.querySelectorAll('.hold.holding').forEach(x=>x.classList.remove('holding')); }
const A_hold={saveResult};
document.addEventListener('pointerdown',holdStart);
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,holdEnd));
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && document.activeElement?.dataset?.hold){ e.preventDefault(); saveResult(); } });

/* ================= BOOT ================= */
(async()=>{
  await DB.open();
  const stored=await DB.get();
  LOCAL_FRESH=!stored;
  if(stored && stored.v===2 && stored.profiles){ ROOT={v:2,active:stored.active,profiles:{},lylaAdded:!!stored.lylaAdded};
    for(const [k,o] of Object.entries(stored.profiles)) ROOT.profiles[k]=norm(o);
    if(!ROOT.profiles[ROOT.active]) ROOT.active=Object.keys(ROOT.profiles)[0]; }
  else if(stored && stored.v===1){ ROOT={v:2,active:'p1',profiles:{p1:norm(stored)},lylaAdded:false}; }
  if(!ROOT.lylaAdded){ ROOT.lylaAdded=true; if(!Object.values(ROOT.profiles).some(x=>x.player.name.toLowerCase()==='lyla')){ const ly=freshState('Lyla',6); ly.player.ageSet=false; ROOT.profiles['p'+uid()]=ly; } }
  S=ROOT.profiles[ROOT.active];
  ensureSeason(); afterSave(0,null); save();
  if(S.inProgress) toasts.push(`Unfinished ${drillOf(S.inProgress).name} saved · open it to keep going`);
  render();
  setTimeout(()=>{toasts=[]},2800);
  cloudInit();
})();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
